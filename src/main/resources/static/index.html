<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">📚</div>
      <h1>Library Management</h1>
      <p>Sign in to your account or create a new one</p>
    </div>

    <div id="alert" class="alert"></div>

    <div class="tabs">
      <div class="tab active" data-tab="login-pane">Login</div>
      <div class="tab"       data-tab="reg-pane">Register</div>
    </div>

    <!-- Login -->
    <div id="login-pane" class="tab-pane active">
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="demo@library.com" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign in</button>
      </form>
      <p style="margin-top:1rem;font-size:.8rem;color:var(--muted);text-align:center">
        Demo account: <strong>demo@library.com</strong> / <strong>demo123</strong>
      </p>
    </div>

    <!-- Register -->
    <div id="reg-pane" class="tab-pane">
      <form id="reg-form">
        <div class="form-group">
          <label for="reg-name">Full name</label>
          <input type="text" id="reg-name" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-pass">Password <small style="color:var(--muted)">(min 4 chars)</small></label>
          <input type="password" id="reg-pass" placeholder="••••••••" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create account</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Redirect if already logged in
  if (getUserId()) window.location.href = '/catalog.html';

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
      hideAlert();
    });
  });

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type} show`;
    el.textContent = msg;
  }
  function hideAlert() {
    document.getElementById('alert').classList.remove('show');
  }

  // Login
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const pass  = document.getElementById('login-pass').value;
    try {
      const res = await Auth.login(email, pass);
      localStorage.setItem('userId',    res.userId);
      localStorage.setItem('userName',  res.name);
      localStorage.setItem('unreadCount', res.unreadNotifications);
      window.location.href = '/catalog.html';
    } catch (err) {
      showAlert(err.message);
    }
  });

  // Register
  document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name  = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const pass  = document.getElementById('reg-pass').value;
    try {
      await Auth.register(email, pass, name);
      showAlert('Account created! You can now log in.', 'success');
      // Switch to login tab
      document.querySelector('[data-tab="login-pane"]').click();
      document.getElementById('login-email').value = email;
    } catch (err) {
      showAlert(err.message);
    }
  });
</script>
</body>
</html>
