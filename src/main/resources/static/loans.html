<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — My Loans</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
  <a href="/catalog.html" class="navbar-brand">📚 <span>Library</span></a>
  <nav class="nav-links">
    <a href="/catalog.html" class="nav-link">Catalog</a>
    <a href="/loans.html"   class="nav-link active">My Loans</a>
  </nav>
  <div class="nav-user">
    <span id="user-name"></span>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
  </div>
</header>

<div class="page-heading">
  <h1>My Loans</h1>
  <p>View your active, overdue, and returned items</p>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Borrowed</th>
        <th>Due date</th>
        <th>Status</th>
        <th>Penalty</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="loans-tbody">
      <tr><td colspan="7" class="spinner">Loading…</td></tr>
    </tbody>
  </table>
</div>

<script src="/js/api.js"></script>
<script src="/js/loans.js"></script>
</body>
</html>
